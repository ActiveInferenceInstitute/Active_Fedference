# Active Fedference — Project Configuration
#
# This file is the meta-artifact linking manuscript prose to the execution layer.
# It is loaded by `yaml.safe_load` for manuscript metadata (paper/authors/keywords)
# and by the experiment harness for the `experiment:` block. Every numeric in the
# prose is a generated token hydrated from analysis outputs — never hand-typed.

paper:
  title: "Robust Belief Sharing in Federated Active Inference"
  subtitle: "A Recovery-Tested Generalized-Variational Framework for Categorical Contamination-Aware Consensus"
  cover:
    image: "cover_image.png"
    alt: "Graphical abstract showing honest and contaminated agents broadcasting beliefs into a robust fusion server, with naive and robust consensus outcomes compared as schematic distribution cards."
    description: "Reproducible Active Fedference cover generated by src/figures/graphical_abstract.py."
  version: "1.0.3"
  date: "" # Auto-generated at render time if empty

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  doi: "10.5281/zenodo.21969756" # Reserved for the v1.0.3 release; publish only after final verification.
  github_repository: "https://github.com/ActiveInferenceInstitute/Active_Fedference"
  journal: ""
  year: "2026"
  # Canonical metadata copy — single source of truth consumed by
  # src/publication/metadata.py, which emits CITATION.cff, .zenodo.json, and
  # codemeta.json (MED-2). Edit HERE, then run `python scripts/emit_metadata.py
  # --write`; never hand-edit the three generated files.
  # Zenodo's API field named `description` is its deposited-record abstract;
  # the emitter therefore uses the full `abstract` below for Zenodo, while
  # retaining this shorter package description for software metadata.
  software_name: "Active Fedference"
  date_created: "2026-06-24"
  date_released: "2026-08-16"
  abstract: >-
    Active Fedference is a tested, reproducible research package that connects
    two previously separate ideas: the belief-sharing account of distributed
    cognition from active inference, and robust federated learning. It
    reimplements the core update rules of Federated Generalized Variational
    Inference (FedGVI) in the discrete-categorical setting and certifies, in
    executable form within that implementation, the project-local identity
    `robust_aggregate(robustness=0) == log_linear_pool`. Under documented
    shared-support, posterior-log-potential, and fixed-weight assumptions, that
    log pool is a categorical specialization of the message-combination term in
    Friston et al. (2024) Eq. 7; it is not a reconstruction of the complete
    source protocol. In the declared confident-wrong contamination study,
    turning the tested robustness settings on can preserve higher true-state
    consensus mass while contaminated members broadcast confidently wrong
    beliefs; turning them off exactly recovers the project log-linear pool.
    Nine seeded studies, a paired statistical verdict, and a fully token-injected
    manuscript make every reported number reproducible from one command. The
    public source repository is ActiveInferenceInstitute/Active_Fedference.
  description: >-
    Source code and reproducible artifacts for Active Fedference, a
    discrete-categorical research package connecting FedGVI to federated
    active-inference belief sharing.
  github_description: >-
    Robust federated active inference: FedGVI reimplemented in the
    discrete-categorical setting, with an executable project-local log-pool
    recovery identity and a qualified categorical bridge to Friston et al.
    (2024) Eq. 7, plus a conditional contamination study under declared attack
    mechanisms. Nine seeded studies and a fully
    token-injected manuscript. Public release target:
    ActiveInferenceInstitute/Active_Fedference.
  related_identifiers:
    - relation: "isSupplementTo"
      identifier: "https://github.com/ActiveInferenceInstitute/Active_Fedference"
    - relation: "cites"
      identifier: "https://arxiv.org/abs/2502.00846"
    - relation: "cites"
      identifier: "https://doi.org/10.1016/j.neubiorev.2023.105500"

keywords:
  - "active inference"
  - "federated learning"
  - "generalised variational inference"
  - "belief sharing"
  - "robustness"
  - "FedGVI"

metadata:
  license: "MIT"
  language: "en"
  # Use the template's source-bound LuaLaTeX/tagpdf path for the combined
  # manuscript. The renderer binds registry alternatives to figures and fails
  # closed when the configured cover lacks an alternative.
  tagged_pdf: true

# Render format toggles.
render:
  formats:
    pdf: true
    html: true
    slides: true
    docx: false
    epub: false

# Keep source fragments modular while allowing them to flow continuously in
# the combined PDF. This avoids forced file-boundary page breaks, orphaned
# tails, and near-empty pages; intentionally authored page breaks remain
# explicit in the manuscript source.
rendering:
  section_breaks: false

# LLM review / translation toggles (optional; require Ollama).
llm:
  reviews:
    enabled: false
    types:
      - methodology_review
  translations:
    enabled: false
    languages: []

# Real-computation tolerance: any failure blocks manuscript rendering.
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Experiment parameters — consumed by `src/experiment_config.py`
# (load_experiment_config) and, through it, the experiment harness and the
# manuscript-variable generator. Only keys that load_experiment_config actually
# reads live here. All other per-study parameters (acuity, language-acquisition
# steps, emergence scales, contamination internals) live as code defaults in
# `src/fedference/experiments/` and are surfaced as manuscript tokens directly
# from those constants — config keys the loader never consumed have been
# removed as dead duplication.
experiment:
  # Publication budgets are the default. Temporary test projects may declare
  # `analysis_profile: smoke` for repeated real, lower-budget checks.
  analysis_profile: publication
  # Independent-seed budget for the across-seed studies (belief sharing) and the
  # paired-trial count of the robustness verdict. Raised to a defensible n so the
  # Wilcoxon/BH-FDR panel and the bootstrap CIs have real sample size behind them.
  # Runs derive their deterministic seed list as range(n_seeds)
  # (ExperimentConfig.seeds); there is no single global seed knob.
  n_seeds: 480
  # Independent seed budget for structural-extension reports and the
  # cross-study overview. This replaces the former five-seed smoke summary;
  # it is kept separate from n_seeds so the compute budget is explicit.
  replicate_seeds: 128

  # Study 4 — contaminated-sentinel robustness sweep (the FedGVI contribution).
  # `divergences` lists the FedGVI client-divergence labels; KLD is the non-robust
  # Friston / standard-Bayes baseline (robustness 0), the rest are robust members.
  # `n_agents` here is the executed colony size for ALL studies (the sweep block
  # takes precedence in load_experiment_config).
  robustness_sweep:
    rates: [0.0, 0.225, 0.45, 0.675, 0.9]
    divergences: ["KLD", "RKL", "AR", "beta", "rcce"]
    n_agents: 7
    n_trials: 960

  # Matched trials per contamination rate in the cross-study overview. The
  # primary robustness verdict above uses the larger n_trials budget.
  cross_study_n_trials: 40
  # Conditional-world and proper-score extension. Seeds are the independent
  # unit; trials remain nested within each world/scenario cell.
  conditional_world_n_seeds: 64
  conditional_world_n_trials: 24
  # Bounded source-bound review grid: expanded seed budget over the existing
  # finite conditional cells plus the declared onset-rate profiles.
  # This independently seeded validation lane is sized before the rerun to
  # require a maximum method×rate MCSE no larger than 0.01.  The report fails
  # closed if the registered target is not met; all signed cells are retained.
  review_grid_n_seeds: 160
  review_grid_n_trials: 24
  review_grid_rates: [0.0, 0.2, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]
  review_grid_target_max_mcse: 0.01

  # These formerly hard-coded publication lanes now have explicit source
  # budgets, so reports and manuscript tokens cannot silently fall back to a
  # small diagnostic grid.
  gallery_n_seeds: 64
  gallery_n_trials: 24
  onset_n_seeds: 64
  onset_n_trials: 24
  bnn_n_seeds: 64
  bnn_n_per: 200

  # Executed PyTorch point-mass complement. This separate block is consumed by
  # analysis.workflow because its architecture/training knobs are not part of
  # the frozen categorical ExperimentConfig. Tests use an explicit smaller
  # profile in temporary configs; they never mutate this publication lane.
  bnn_torch:
    n_clients: 5
    n_per: 80
    hidden_dim: 16
    n_steps: 200
    robustness: 0.5
    beta: 0.5
    contamination_levels: [0.0, 0.2, 0.4]

  # Implementation-complexity calculation and bounded machine-scaling study.
  # The symbolic orders come from src/fedference/complexity.py; these grids
  # control only the executed timing diagnostic and are not performance claims.
  complexity:
    agent_sizes: [4, 8, 16, 32, 64]
    state_sizes: [256, 512, 1024, 2048, 4096]
    sharing_agent_sizes: [4, 8, 16, 32]
    modality_sizes: [1, 2, 4, 8]
    fixed_agent_count: 256
    fixed_state_count: 64
    inference_state_count: 16384
    observation_count: 4
    repeats: 5
    warmups: 1
    max_iter: 6
    variational_starts: 3
    seed: 20260728

  # Paired-statistics / multiple-testing deflation (Algorithm Gate I). The
  # primary sweep and the all-method review grid consume these registered
  # levels; their reports echo the executed values rather than hard-coding a
  # second statistical design.
  statistics:
    test: "wilcoxon"        # matched-pairs signed-rank (statistics.paired_test)
    fdr_alpha: 0.05         # Benjamini-Hochberg family-wise FDR (statistics.bh_fdr)
    # Power analysis for the headline robust-vs-naive Wilcoxon (statistics.power_analysis):
    # the alpha and one-sided alternative the achieved-power / prospective-n tokens use.
    power_alpha: 0.05
    power_alternative: "greater"   # robust accuracy > naive (directional)
    target_power: 0.80             # prospective sample-size justification target

# Stage 02 analysis-script allowlist.
# Declares the exact set of scripts that Stage 02 (run_analysis_pipeline)
# should execute, overriding the lexicographic auto-discovery fallback.
# Aesthetic / opt-in scripts (e.g. _generate_api_docs.py, 00_preflight.py)
# are excluded here and must be invoked explicitly.
analysis:
  scripts:
    - 01_run_invariants.py
    - 02_run_analysis.py
    - z_generate_manuscript_variables.py
