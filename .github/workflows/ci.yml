name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast-checks:
    name: Fast source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync locked dev dependencies
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run --locked ruff check src/ tests/ scripts/ examples/ _fedference_build_backend.py

      - name: GitHub-compatible Mermaid contract
        run: uv run --locked python scripts/validate_mermaid.py

      - name: Mypy
        run: uv run --locked mypy src/

      - name: Metadata surfaces are emitter-consistent
        run: uv run --locked python scripts/emit_metadata.py --check


  test-plan:
    name: Complete test inventory
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Collect every test and balance whole modules
        run: uv run --locked python scripts/ci_shards.py plan --plan .tmp/ci-plan/plan.json --count 4
      - uses: actions/upload-artifact@v4
        with:
          name: test-plan
          path: .tmp/ci-plan/plan.json
          if-no-files-found: error
          retention-days: 30

  test-shards:
    name: Full-suite shard ${{ matrix.index }}
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils qpdf
      - name: Install pinned Chromium
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --prefix .tmp/playwright-node --no-package-lock --no-save @playwright/test@1.62.1
          .tmp/playwright-node/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: test-plan
          path: .tmp/ci-plan
      - name: Execute assigned tests with coverage and timings
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: uv run --locked python scripts/ci_shards.py run --plan .tmp/ci-plan/plan.json --index "$SHARD_INDEX"
      - name: Retain shard results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.index }}
          path: .tmp/ci-shards/shard-${{ matrix.index }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: [fast-checks, test-shards, compatibility]
    if: always()
    runs-on: ubuntu-latest
    # This final job verifies combined coverage, reproducible distributions,
    # installed-package behavior and every publication surface. Preserve
    # headroom for the real browser/PDF probes on hosted runners.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Require every prerequisite job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json, os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values())'
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (locked dev extra)
        run: uv sync --locked --extra dev

      - name: Install PDF surface validation tools
        # The rendered-surface gate validates extracted text and PDF structure;
        # keep those external probes explicit on the clean Ubuntu runner.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils qpdf

      - name: Install Chromium for rendered-reader reflow checks
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --prefix .tmp/playwright-node --no-package-lock --no-save @playwright/test@1.62.1
          .tmp/playwright-node/node_modules/.bin/playwright install --with-deps chromium

      - name: Download complete test plan
        uses: actions/download-artifact@v4
        with:
          name: test-plan
          path: .tmp/ci-plan

      - name: Download all shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: .tmp/ci-shards

      - name: Verify complete test execution and combined coverage
        run: |
          uv run --locked python scripts/ci_shards.py verify --plan .tmp/ci-plan/plan.json
          uv run --locked coverage combine --keep .tmp/ci-shards/shard-*
          uv run --locked coverage report --fail-under=90
          uv run --locked coverage json -o .tmp/combined-coverage.json

      - name: Retain combined coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/combined-coverage.json
            .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Build and smoke-test wheel and source distribution
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --out-dir .tmp/dist
          uv build --out-dir .tmp/dist-rebuilt
          cmp .tmp/dist/*.whl .tmp/dist-rebuilt/*.whl
          cmp .tmp/dist/*.tar.gz .tmp/dist-rebuilt/*.tar.gz
          sdist="$(find .tmp/dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          for member in LICENSE docs/README.md docs/application-guide.md docs/development/modularity.md examples/README.md examples/01_minimal_aggregation.py examples/02_compare_aggregation_methods.py examples/03_federation_boundaries.py examples/04_cli_receipt_workflow.py examples/05_labeled_application.py examples/data/labeled_aggregation_request.json manuscript/config.yaml manuscript/config.yaml.example scripts/02_run_analysis.py src/fedference/py.typed src/fedference_cli/README.md tests/README.md; do
            tar -tzf "$sdist" | grep -Eq "/$member$"
          done
          checkout_root="$(pwd -P)"
          installed_smoke_root="$(mktemp -d)"
          cp examples/data/labeled_aggregation_request.json "$installed_smoke_root/request.json"
          wheel_smoke_env="$checkout_root/.tmp/wheel-smoke"
          uv venv .tmp/wheel-smoke
          uv pip install --python .tmp/wheel-smoke/bin/python .tmp/dist/*.whl
          (
            cd "$installed_smoke_root"
            "$wheel_smoke_env/bin/fedference" list --json
            "$wheel_smoke_env/bin/python" -c "import sys; from importlib.metadata import version; from importlib.resources import files; import fedference; assert fedference.__version__ == version('active_fedference'); assert files('fedference').joinpath('py.typed').is_file(); assert 'torch' not in sys.modules"
            "$wheel_smoke_env/bin/python" -c "import json; from pathlib import Path; from fedference import LabeledAggregationRequest, aggregate_labeled; request = LabeledAggregationRequest.from_json(Path('request.json').read_text()); assert aggregate_labeled(request).aggregation.solver_status == 'nominal'; assert 'torch' not in __import__('sys').modules"
            "$wheel_smoke_env/bin/python" -c "from fedference.benchmark import run_tabular_benchmark; assert run_tabular_benchmark(seed=0)['n_rows'] == 150"
            "$wheel_smoke_env/bin/fedference" aggregate --input request.json --output-dir wheel-run
            "$wheel_smoke_env/bin/fedference" verify wheel-run/receipt.json --require-nominal-solver
            test -s wheel-run/request.json
            test -s wheel-run/result.json
            test -s wheel-run/receipt.json
          )
          sdist_smoke_env="$checkout_root/.tmp/sdist-smoke"
          uv venv .tmp/sdist-smoke
          uv pip install --python .tmp/sdist-smoke/bin/python .tmp/dist/*.tar.gz
          (
            cd "$installed_smoke_root"
            "$sdist_smoke_env/bin/fedference" list --json
            "$sdist_smoke_env/bin/python" -c "import sys; from importlib.metadata import version; from importlib.resources import files; import fedference; assert fedference.__version__ == version('active_fedference'); assert files('fedference').joinpath('py.typed').is_file(); assert 'torch' not in sys.modules"
            "$sdist_smoke_env/bin/python" -c "import json; from pathlib import Path; from fedference import LabeledAggregationRequest, aggregate_labeled; request = LabeledAggregationRequest.from_json(Path('request.json').read_text()); assert aggregate_labeled(request).aggregation.solver_status == 'nominal'; assert 'torch' not in __import__('sys').modules"
            "$sdist_smoke_env/bin/python" -c "from fedference.benchmark import run_tabular_benchmark; assert run_tabular_benchmark(seed=0)['n_rows'] == 150"
            "$sdist_smoke_env/bin/fedference" aggregate --input request.json --output-dir sdist-run
            "$sdist_smoke_env/bin/fedference" verify sdist-run/receipt.json --require-nominal-solver
            test -s sdist-run/request.json
            test -s sdist-run/result.json
            test -s sdist-run/receipt.json
          )

      - name: Clean-checkout tracking and import probe
        # Run this probe before the invariant writer and release builders,
        # which intentionally emit generated reviewer artifacts.  The probe
        # validates the checkout delivered by GitHub and the package imports,
        # rather than treating those later producer outputs as test pollution.
        run: uv run --locked python scripts/validate_clean_checkout.py

      - name: Numerical invariants
        run: uv run --locked python scripts/01_run_invariants.py

      - name: Publication package validation
        run: uv run --locked python scripts/validate_all.py package

      - name: Rendered publication surface validation
        run: uv run --locked python scripts/validate_all.py rendered

      - name: Publication pipeline freshness
        run: uv run --locked python scripts/validate_pipeline_freshness.py

      - name: Release bundle build
        run: uv run --locked python scripts/build_release.py

      - name: Release bundle verify
        run: uv run --locked python scripts/build_release.py --verify

      - name: Upload release provenance
        uses: actions/upload-artifact@v4
        with:
          name: active-fedference-release-provenance
          path: |
            output/release/
            output/reports/validation_report.*
          retention-days: 14

  compatibility:
    needs: fast-checks
    name: Python ${{ matrix.python-version }} compatibility smoke
    runs-on: ubuntu-latest
    # The complete non-slow suite is intentionally retained for compatibility
    # coverage; hosted runners need more wall-clock headroom than the local
    # CPU reference, so the timeout must not turn a passing lane into a false
    # release failure.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync locked dev dependencies
        run: uv sync --locked --extra dev

      - name: Install PDF fixture validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils qpdf

      - name: Non-slow source smoke suite
        # Python 3.10 has no stdlib tomllib; the test suite's TOML probes are
        # intentionally kept stdlib-first, so alias the locked tomli fallback
        # only for this compatibility subprocess.  Python 3.11+ uses its
        # standard-library module unchanged.
        run: |
          mkdir -p .tmp/ci-timings
          uv run --locked --extra dev python -c '
          import sys
          if sys.version_info < (3, 11):
              import tomli
              sys.modules["tomllib"] = tomli
          import pytest
          raise SystemExit(pytest.main(["tests/", "-m", "not slow and not publication", "-q", "--durations=0", "--junitxml=.tmp/ci-timings/compatibility.xml"]))
          '

      - name: Retain compatibility timing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-timings-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-timings/
          if-no-files-found: error
          retention-days: 30
