  abstract: 'Multi-agent active inference gives a natural account of belief sharing:
    agents hold local posteriors over a shared latent state, communicate those beliefs,
    and pool them into a colony-level consensus. The same mechanism is fragile when
    a member is miscalibrated, corrupted, or strategically wrong. Because the standard
    pool multiplies the reports together, a single confident-but-wrong broadcast that
    puts near-zero mass on the true state can pull the whole consensus off it, outweighing
    many honest members. The colony therefore needs a way to preserve the useful structure
    of belief sharing while limiting the influence of contaminated beliefs.

    This paper presents Active Fedference, a discrete-categorical framework that connects
    robust federated generalized variational inference with active inference belief
    sharing. The main bridge is structural: standard belief sharing appears as the
    non-robust corner of a broader generalized-Bayes family, while robust losses,
    conservative server fusion, and explicit aggregation diagnostics describe how
    the system moves away from that corner under declared contamination mechanisms.
    The result is not a replacement for belief sharing, but a containment result:
    ordinary belief sharing is recovered when robustness is turned off. Bounded-loss
    theory applies on the client axis, while the variational-server axis supplies
    an objective-backed redescending weight update.

    Following the manuscript''s authoritative three-axis guarantee map, the paper
    keeps source-conditional client updates, a recovery-only heuristic server rule,
    and an objective-backed variational server rule as separate claim owners, with
    no robustness guarantee transferred between them.

    The study suite then exercises the framework as an end-to-end research system:
    recovery checks anchor the standard-Bayes limit, belief-sharing studies verify
    the communication baseline, contamination experiments test robust consensus, and
    extension studies probe moving agents, hierarchical latent structure, sensitivity
    to acuity and colony size, parameter recovery, and single-host socket-backed federation
    traces. All reported quantities are generated from deterministic analysis artifacts
    and injected into the manuscript by token, so the paper, figures, release package,
    and validation reports remain tied to the same execution record.

    The open-source repository is ActiveInferenceInstitute/Active_Fedference. This
    development manuscript has no assigned version DOI; published versions bind their
    reserved DOI, deposited PDF, and repository URL only after the release gates close.'
  description: Source code and reproducible artifacts for Active Fedference, a discrete-categorical
    research package connecting FedGVI to federated active-inference belief sharing.
  github_description: 'Robust federated active inference: FedGVI reimplemented in
    the discrete-categorical setting, with an executable project-local log-pool recovery
    identity and a qualified categorical bridge to Friston et al. (2024) Eq. 7, plus
    a conditional contamination study under declared attack mechanisms. Nine seeded
    studies and a fully token-injected manuscript. Public release target: ActiveInferenceInstitute/Active_Fedference.'
