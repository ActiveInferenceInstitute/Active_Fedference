  - disjoint_fov_world
  - graphical_abstract
  - hierarchical_pomdp
  - moving_world
  - parameter_recovery
  - robustness_onset
  - sensitivity_heatmap
  - system_overview
citation_policy: official_or_scholarly
source_policy: "Prefer primary project outputs (output/reports/*.json), FedGVI and Friston 2024 sources, and manuscript_variables.json."
review_gates:
  - experiment_method_design
  - render_validation
  - publication_readiness
artifact_expectations:
