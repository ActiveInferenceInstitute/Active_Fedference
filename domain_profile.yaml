benchmark_rubric:
  name: fedference-readiness
  dimensions:
    - name: output_validity
      weight: 1.0
    - name: reproducibility_bundle
      weight: 1.0
    - name: artifact_manifest
      weight: 1.0
    - name: evidence_grounding
      weight: 2.0
    - name: render_success
      weight: 1.0
    - name: publication_readiness
      weight: 1.0
llm_prompt_guidance: "Use generated JSON reports and manuscript_variables.json as the evidence source; do not invent numeric results. Respect the three-robustness-axes honesty contract (client-side FedGVI rigorous, server-side heuristic reverse-KL, conservative variational objective-backed)."