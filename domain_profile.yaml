domain: federated_active_inference
display_name: Active Fedference — Robust Federated Active Inference
required_packages:
  - numpy
  - scipy
  - matplotlib
preferred_outputs:
  - pdf
  - html
validation_gates:
  - experiment_method_design
  - artifact_manifest
  - evidence_grounding
  - render_validation
  - publication_readiness
figure_types:
  - belief_sharing_comparison
  - belief_heatmap
  - language_kl_decay
  - emergence_bmr
  - robustness_sweep
  - robust_influence_weights
  - bnn_robustness
  - efe_decomposition
